<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Games</title>
<style>
:root{--bg:#121212;--panel:#181818;--card:#202020;--line:#2c2c2c;--text:#f2f2f2;--mute:#8d8d95;--acc:#2ee6ff;--acc2:#8a5cff;--r:14px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* sidebar */
.side{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.5px;padding:4px 10px 18px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 18px #2ee6ff55}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mute);text-align:left;width:100%;transition:.15s}
.nav:hover{background:#242424;color:var(--text)}
.nav.on{background:#262626;color:var(--text);box-shadow:inset 3px 0 0 var(--acc)}
.nav.on svg{color:var(--acc)}
.sec{margin:18px 12px 6px;color:var(--mute);font-size:12px;font-weight:600}
.ql{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;color:#bdbdc4;width:100%;text-align:left}
.ql:hover{background:#242424}
.ql b{width:22px;height:22px;border-radius:6px;flex:none}
.ql span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-s{margin:0 12px;color:var(--mute);font-size:12px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;transition:.15s}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px #2ee6ff22}
.search input{flex:1;background:none;border:0;outline:0;padding:11px 0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;background:#2a2a2a;transition:.15s}
.btn:hover{background:#343434}
.btn.pri{background:linear-gradient(135deg,var(--acc),#3b8bff);color:#04141a;box-shadow:0 0 22px #2ee6ff44}
.btn.pri:hover{filter:brightness(1.1);background:linear-gradient(135deg,var(--acc),#3b8bff)}
.fbtn{display:none}
.body{flex:1;display:flex;min-height:0}
.content{flex:1;overflow-y:auto;padding:24px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.head h1{font-size:26px}.head span{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:22px}
.card{position:relative;cursor:pointer}
.poster{aspect-ratio:3/4;border-radius:var(--r);background-size:cover;background-position:center;position:relative;overflow:hidden;transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s cubic-bezier(.22,1,.36,1);border:1px solid #ffffff12}
.card:hover .poster,.card:focus-within .poster{transform:scale(1.045);box-shadow:0 10px 34px #000a,0 0 0 1px var(--acc),0 0 26px #2ee6ff33}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;font-weight:800;font-size:22px;line-height:1.05;text-shadow:0 2px 12px #0008}
.fallback small{font-weight:600;font-size:11px;opacity:.8;margin-top:6px}
.fav{position:absolute;top:8px;left:8px;background:#000a;border-radius:8px;padding:3px 7px;font-size:11px;color:var(--acc);backdrop-filter:blur(4px)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 2px 0}
.meta div{min-width:0}
.meta h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{color:var(--mute);font-size:12px}
.dots{padding:4px;border-radius:8px;color:var(--mute)}
.dots:hover{background:#2c2c2c;color:var(--text)}
.menu{position:absolute;right:0;bottom:-6px;transform:translateY(100%);z-index:20;background:#262626;border:1px solid var(--line);border-radius:10px;padding:5px;min-width:170px;box-shadow:0 14px 40px #000c}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px}
.menu button:hover{background:#333}
.menu .del{color:#ff6b7d}
.none{text-align:center;color:var(--mute);padding:80px 20px}
/* filters */
.filters{width:250px;flex:none;border-left:1px solid var(--line);background:var(--panel);padding:20px;overflow-y:auto}
.filters h2{font-size:16px;display:flex;justify-content:space-between;margin-bottom:6px}
.filters h2 button{font-size:12px;color:var(--acc)}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--mute)}details[open] summary::after{content:"–"}
.opt{display:flex;align-items:center;gap:10px;padding:6px 0;color:#c9c9cf;cursor:pointer}
.opt input{accent-color:var(--acc);width:16px;height:16px}
.opt em{margin-left:auto;color:var(--mute);font-style:normal;font-size:12px}
/* modal */
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
.ov.on{opacity:1;visibility:visible;transition:opacity .4s ease}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(860px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 90px #000;will-change:transform,opacity}
.modal.sm{width:min(420px,100%)}.modal.md{width:min(580px,100%)}
.det{display:grid;grid-template-columns:300px 1fr}
.det .poster{aspect-ratio:3/4;border-radius:0;border:0;height:100%;transform:none!important;box-shadow:none!important}
.info{padding:30px;display:flex;flex-direction:column;gap:14px}
.info h2{font-size:30px;line-height:1.1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:4px 12px;border-radius:999px;border:1px solid #3a3a44;color:#c9c9cf;font-size:12px}
.tag.g{border-color:var(--acc);color:var(--acc)}
.info p{color:#bdbdc4;max-width:60ch}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.play{font-size:16px;padding:14px 34px;letter-spacing:1px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:#000a;display:grid;place-items:center;z-index:3}
.x:hover{background:#333}
.mwrap{position:relative}
.frame{width:100%;height:70vh;border:0;background:#000;display:block}
.note{padding:10px 16px;color:var(--mute);font-size:12px;background:#141414}
form.add{padding:28px;display:grid;gap:14px}
form.add h2{font-size:22px}
label{display:grid;gap:6px;font-weight:600;font-size:13px}
label input,label select,label textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:400;outline:0}
label input:focus,label select:focus,label textarea:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card:active .poster{transform:scale(.985)}
.owner-only{display:none}body.owner .owner-only{display:inline-flex}
.launch{position:fixed;inset:0;z-index:80;background:#0a0a0a;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(1.03);transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1),visibility 0s .6s}
.launch.on{opacity:1;visibility:visible;transform:none;transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.lbar{height:48px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#141414;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:3}
.lbar a{margin-left:auto;color:var(--mute);font-size:12px}.lbar a:hover{color:var(--acc)}
.lbar .btn{padding:6px 14px}
.lframe{flex:1;border:0;width:100%;background:#000;opacity:0;transition:opacity .8s ease}.lframe.ready{opacity:1}
.lload{position:absolute;inset:48px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 38%,#1b2c36,#0a0a0a 70%);transition:opacity .7s ease,visibility 0s .7s;z-index:2}
.lload.done{opacity:0;visibility:hidden;pointer-events:none}
.lposter{width:150px;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 0 30px #2ee6ff44)}
@keyframes float{50%{transform:translateY(-9px)}}
.lload h2{font-size:22px}.lload p{color:var(--mute);font-size:13px}.lload a{color:var(--acc)}
.lprog{width:240px;height:4px;border-radius:9px;background:#2a2a2a;overflow:hidden}
.lprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 14px var(--acc)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#262626;border:1px solid var(--acc);padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:1100px){.filters{position:fixed;right:0;top:0;bottom:0;z-index:40;transform:translateX(100%);transition:.25s}.filters.on{transform:none;box-shadow:-20px 0 60px #000}.fbtn{display:inline-flex}}
@media(max-width:760px){.side{width:64px;padding:14px 8px}.side .lbl,.logo b,.sec,.ql span,.empty-s{display:none}.nav,.ql{justify-content:center;padding:11px}.logo{justify-content:center;padding:4px 0 14px}.det{grid-template-columns:1fr}.det .poster{aspect-ratio:16/10;height:auto}.top{padding:12px}.content{padding:16px}.btn .lbl{display:none}.two{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside class="side" aria-label="Main navigation">
  <div class="logo" id="logo" role="button" aria-label="Play Games"><i></i><b>PLAY GAMES</b></div>
  <button class="nav on" data-view="store"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 12h-13zM8 7a4 4 0 018 0"/></svg><span class="lbl">Store</span></button>
  <button class="nav" data-view="library"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="M17 6l4 1-3 13-4-1"/></svg><span class="lbl">Library</span></button>
  <button class="nav" data-view="favs"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.600-7 10-7 10z"/></svg><span class="lbl">Favorites</span></button>
  <div class="sec">Categories</div>
  <div id="cats"></div>
  <div class="sec">Quick launch</div>
  <div id="ql"></div>
</aside>
<div class="main">
  <header class="top">
    <label class="search" style="font-weight:400"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search games, genres or tags" aria-label="Search games"></label>
    <button class="btn fbtn" id="fbtn"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="lbl">Filters</span></button>
    <button class="btn pri owner-only" id="addbtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Add game</span></button><button class="btn owner-only" id="exportbtn"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Export games</span></button><button class="btn owner-only" id="lockbtn"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span class="lbl">Lock</span></button>
  </header>
  <div class="body">
    <main class="content">
      <div class="head"><h1 id="title">Store</h1><span id="count"></span></div>
      <div class="grid" id="grid"></div>
    </main>
    <aside class="filters" id="filters" aria-label="Filters">
      <h2>Filters <button id="clear">Clear all</button></h2>
      <div id="fgroups"></div>
    </aside>
  </div>
</div>

<div class="ov" id="ov"><div class="modal mwrap" id="modal"></div></div>
<div class="launch" id="launch" aria-hidden="false"><div class="lbar"><button class="btn" id="exit"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back to Play Games</button><strong id="ltitle"></strong><a id="lnew" target="_blank" rel="noopener">Not loading? Open in new tab</a></div>
<div class="lload" id="lload"><div class="lposter" id="lposter"></div><h2 id="lname"></h2><div class="lprog" id="lprog"><i></i></div><p id="lslow" hidden>Taking longer than usual. <a id="lnew2" href="#" onclick="document.getElementById('lnew').click();return false">Open in a new tab</a></p></div>
<iframe class="lframe" id="lframe" title="Game" allow="fullscreen; gamepad; autoplay; clipboard-write; microphone" referrerpolicy="no-referrer"></iframe></div>

/* ============ Storage ============ */
const KEY={custom:"playgames.owner.v1",favs:"playgames.favs.v1",recent:"playgames.recent.v1",hidden:"playgames.hidden.v1"};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Storage is full — export and clear old games")}}};
let custom=store.get(KEY.custom,[]),favs=store.get(KEY.favs,[]),recent=store.get(KEY.recent,[]),hidden=store.get(KEY.hidden,[]);
const hashPin=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const all=()=>{const ids=new Set(GAMES.map(g=>g.id)),m=new Map(custom.map(g=>[g.id,g]));
  return[...custom.filter(g=>!ids.has(g.id)),...GAMES.map(g=>m.get(g.id)||g)].filter(g=>!hidden.includes(g.id))};
const byId=id=>all().find(g=>g.id===id);

/* ============ Helpers ============ */
const $=s=>document.querySelector(s);
const EASE="cubic-bezier(.22,1,.36,1)";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue=t=>[...t].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const grad=g=>g.c||[`hsl(${hue(g.title)} 80% 55%)`,`hsl(${(hue(g.title)+70)%360} 70% 22%)`];
const bg=g=>`linear-gradient(160deg,${grad(g)[0]},${grad(g)[1]})`;
const safeUrl=u=>{try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}};
const safeImg=u=>/^data:image\/(jpeg|png|webp);base64,/.test(u||"")?u:safeUrl(u);
const reduce=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
function poster(g){const img=safeImg(g.img);
  return`<div class="poster" style="background:${bg(g)}">${img?`<img src="${esc(img)}" alt="${esc(g.title)} thumbnail" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<div class="fallback" style="${img?"z-index:-1":""}">${esc(g.title)}<small>${esc(g.genre)}</small></div></div>`}
const toDataUrl=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,480/i.width,640/i.height),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.86))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)});

/* ============ State & render ============ */
let view="store",query="",cat=null,sel={genre:new Set(),tag:new Set(),platform:new Set()},owner=false;
try{owner=sessionStorage.getItem("pg.owner")==="1"}catch(e){}
function visible(){let l=all();
  if(view==="library")l=l.filter(g=>recent.includes(g.id)||favs.includes(g.id));
  if(view==="favs")l=l.filter(g=>favs.includes(g.id));
  if(cat)l=l.filter(g=>g.genre===cat);
  const q=query.trim().toLowerCase();
  if(q)l=l.filter(g=>[g.title,g.genre,g.desc,...(g.tags||[])].join(" ").toLowerCase().includes(q));
  if(sel.genre.size)l=l.filter(g=>sel.genre.has(g.genre));
  if(sel.tag.size)l=l.filter(g=>[...sel.tag].every(t=>(g.tags||[]).includes(t)));
  if(sel.platform.size)l=l.filter(g=>sel.platform.has(g.platform));
  if(view==="library")l.sort((a,b)=>recent.indexOf(a.id)-recent.indexOf(b.id));
  return l}
function render(){const list=visible();
  $("#title").textContent={store:cat||"Store",library:"Library",favs:"Favorites"}[view];
  $("#count").textContent=`${list.length} game${list.length===1?"":"s"}`;
  $("#grid").innerHTML=list.length?list.map(g=>`<div class="card" data-id="${g.id}">${poster(g)}${favs.includes(g.id)?'<span class="fav">♥ Favorite</span>':""}<div class="meta"><div><h3>${esc(g.title)}</h3><p>${esc(g.genre)}</p></div><button class="dots" data-menu="${g.id}" aria-label="Options for ${esc(g.title)}"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div></div>`).join(""):`<div class="none" style="grid-column:1/-1"><h2>${view==="store"?"No games match":"Nothing here yet"}</h2><p>${view==="store"?"Clear a filter or try another search.":"Play or favorite a game from the Store and it will show up here."}</p></div>`;
  renderFilters();renderSide()}
function renderSide(){const gs=[...new Set(all().map(g=>g.genre))].sort();
  $("#cats").innerHTML=gs.map(n=>`<button class="ql" data-cat="${esc(n)}" style="${cat===n?"background:#262626;color:#fff":""}"><b style="background:linear-gradient(135deg,hsl(${hue(n)} 80% 55%),hsl(${(hue(n)+60)%360} 70% 30%))"></b><span>${esc(n)}</span></button>`).join("");
  const r=recent.map(byId).filter(Boolean).slice(0,5);
  $("#ql").innerHTML=r.length?r.map(g=>`<button class="ql" data-play="${g.id}" title="Launch ${esc(g.title)}"><b style="background:${bg(g)}"></b><span>${esc(g.title)}</span></button>`).join(""):'<p class="empty-s">Games you play appear here.</p>'}
function renderFilters(){const gs=all();
  const G=[["genre","Genre",[...new Set(gs.map(g=>g.genre))].sort(),g=>[g.genre]],["tag","Features",[...new Set(gs.flatMap(g=>g.tags||[]))].sort(),g=>g.tags||[]],["platform","Platform",[...new Set(gs.map(g=>g.platform))].sort(),g=>[g.platform]]];
  $("#fgroups").innerHTML=G.map(([k,l,o,fn])=>`<details open><summary>${l}</summary>${o.map(v=>`<label class="opt" style="font-weight:400"><input type="checkbox" data-f="${k}" value="${esc(v)}" ${sel[k].has(v)?"checked":""}>${esc(v)}<em>${gs.filter(g=>fn(g).includes(v)).length}</em></label>`).join("")}</details>`).join("")}
function setOwner(v){owner=v;document.body.classList.toggle("owner",v);try{sessionStorage.setItem("pg.owner",v?"1":"0")}catch(e){}}

/* ============ Modal (smooth open / close) ============ */
const ov=$("#ov"),modal=$("#modal");let closeT;
function openModal(h,cls){clearTimeout(closeT);modal.getAnimations().forEach(a=>a.cancel());modal.className="modal mwrap "+(cls||"");
  modal.innerHTML=`<button class="x" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`+h;ov.classList.add("on")}
function closeModal(){if(!ov.classList.contains("on"))return;ov.classList.remove("on");
  modal.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(12px) scale(.98)"}],{duration:260,easing:"ease-in",fill:"forwards"});
  closeT=setTimeout(()=>{modal.innerHTML=""},400)}
function detail(id,card){const g=byId(id);if(!g)return;
  openModal(`<div class="det">${poster(g)}<div class="info"><h2>${esc(g.title)}</h2><div class="tags"><span class="tag g">${esc(g.genre)}</span>${(g.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}<span class="tag">${esc(g.platform)}</span></div><p>${esc(g.desc||"No description yet.")}</p><div class="acts"><button class="btn pri play" data-play="${g.id}">PLAY NOW</button><button class="btn" data-fav="${g.id}">${favs.includes(g.id)?"♥ In favorites":"♡ Add to favorites"}</button></div></div></div>`);
  const src=card&&card.querySelector(".poster"),mp=modal.querySelector(".poster"),b=mp.getBoundingClientRect();
  if(reduce())return;
  modal.animate([{opacity:0,transform:"translateY(18px) scale(.97)"},{opacity:1,transform:"none"}],{duration:480,easing:EASE});
  modal.querySelectorAll(".info>*").forEach((el,i)=>el.animate([{opacity:0,transform:"translateY(16px)"},{opacity:1,transform:"none"}],{duration:520,delay:200+i*70,easing:EASE,fill:"backwards"}));
  if(src){const a=src.getBoundingClientRect(),ghost=src.cloneNode(true);
    Object.assign(ghost.style,{position:"fixed",left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px",margin:0,zIndex:70,transformOrigin:"top left",pointerEvents:"none",transition:"none",boxShadow:"0 24px 70px #000b",borderRadius:"14px"});
    document.body.appendChild(ghost);mp.style.visibility="hidden";
    ghost.animate([{transform:"none",borderRadius:"14px"},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width},${b.height/a.height})`,borderRadius:"10px"}],{duration:580,easing:EASE,fill:"forwards"}).onfinish=()=>{mp.style.visibility="";ghost.remove()}}}

/* ============ Play: smooth in-site launcher ============ */
let launchT;
function play(id){const g=byId(id);if(!g)return;const u=safeUrl(g.url);if(!u){toast("This game has no valid play link");return}
  recent=[id,...recent.filter(x=>x!==id)].slice(0,20);store.set(KEY.recent,recent);
  if(g.embed===false){window.open(u,"_blank","noopener");render();return}
  closeModal();const L=$("#launch"),f=$("#lframe"),bar=$("#lprog i");
  $("#lname").textContent=g.title;$("#ltitle").textContent=g.title;$("#lposter").innerHTML=poster(g);$("#lnew").href=u;$("#lslow").hidden=true;
  f.classList.remove("ready");$("#lload").classList.remove("done");bar.style.transition="none";bar.style.width="0";
  L.classList.add("on");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition="width 7s cubic-bezier(.1,.6,.2,1)";bar.style.width="88%"}));
  const t0=Date.now();
  f.onload=()=>{if(!L.classList.contains("on"))return;setTimeout(()=>{bar.style.transition="width .4s ease";bar.style.width="100%";setTimeout(()=>{f.classList.add("ready");$("#lload").classList.add("done")},380)},Math.max(0,1500-(Date.now()-t0)))};
  f.src=u;clearTimeout(launchT);launchT=setTimeout(()=>{$("#lslow").hidden=false},9000);render()}
function exitGame(){$("#launch").classList.remove("on");clearTimeout(launchT);setTimeout(()=>{$("#lframe").src="about:blank"},600)}

/* ============ Owner tools ============ */
function askPin(){openModal(`<form class="add" id="pinf"><h2>Owner sign-in</h2><label>PIN<input name="pin" type="password" autocomplete="current-password" required></label><div class="acts"><button class="btn pri" type="submit">Unlock</button><button class="btn" type="button" data-close>Cancel</button></div></form>`,"sm");modal.querySelector("input").focus()}
function addForm(id){const g=id?byId(id):{};
  openModal(`<form class="add" id="addf" data-edit="${esc(id||"")}"><h2>${id?"Edit game":"Add new game"}</h2>
  <label>Game title<input name="title" required maxlength="60" value="${esc(g.title)}"></label>
  <label>Game play link<input name="url" type="url" required placeholder="https://..." value="${esc(g.url)}"></label>
  <label>Thumbnail <span style="font-weight:400;color:var(--mute)">(upload an image, or paste a link)</span><input name="file" type="file" accept="image/*"><input name="img" type="url" placeholder="https://.../poster.jpg" value="${g.img&&!g.img.startsWith("data:")?esc(g.img):""}"></label>
  <div class="two"><label>Genre<input name="genre" required maxlength="30" list="gl" value="${esc(g.genre)}"><datalist id="gl">${[...new Set(all().map(x=>x.genre))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist></label>
  <label>Platform<select name="platform">${["Browser","Mobile","Desktop"].map(p=>`<option ${g.platform===p?"selected":""}>${p}</option>`).join("")}</select></label></div>
  <label>Tags <span style="font-weight:400;color:var(--mute)">(comma separated)</span><input name="tags" value="${esc((g.tags||[]).join(", "))}"></label>
  <label>Description<textarea name="desc" rows="3" maxlength="400">${esc(g.desc)}</textarea></label>
  <label class="opt" style="font-weight:400"><input type="checkbox" name="embed" ${g.embed===false?"":"checked"}>Play inside Play Games (turn off if the game site refuses to load)</label>
  <div class="acts"><button class="btn pri" type="submit">Save game</button><button class="btn" type="button" data-close>Cancel</button></div></form>`,"md")}
function exportGames(){const code="const GAMES = "+JSON.stringify(all(),null,1)+";";
  openModal(`<div class="add"><h2>Publish your games</h2><p style="color:var(--mute)">Games you add are saved in this browser only. To show them to every visitor, copy the code below, replace the <b>const GAMES = [ ... ];</b> block in the HTML file, and upload the file again.</p><textarea id="exp" rows="9" readonly style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px monospace;width:100%">${esc(code)}</textarea><div class="acts"><button class="btn pri" data-copy>Copy code</button><button class="btn" data-close>Close</button></div></div>`,"md")}

/* ============ Events ============ */
function closeMenus(){document.querySelectorAll(".menu").forEach(m=>m.remove())}
function showMenu(btn){const id=btn.dataset.menu,had=btn.closest(".card").querySelector(".menu");closeMenus();if(had)return;
  btn.closest(".card").insertAdjacentHTML("beforeend",`<div class="menu"><button data-act="fav:${id}">${favs.includes(id)?"Remove favorite":"Add to favorites"}</button><button data-act="open:${id}">Open in new tab</button>${owner?`<button data-act="edit:${id}">Edit game</button><button class="del" data-act="del:${id}">Remove game</button>`:""}</div>`)}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[id,...favs];store.set(KEY.favs,favs);toast(favs.includes(id)?"Added to favorites":"Removed from favorites");render()}
function setNav(v){view=v;cat=null;document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.view===v))}
document.addEventListener("click",e=>{const t=e.target.closest("button,.card,.ov");
  if(!t){closeMenus();return}
  if(t.matches(".nav")){setNav(t.dataset.view);render();return}
  if(t.id==="logo"){logo.n=(logo.n||0)+1;clearTimeout(logo.t);logo.t=setTimeout(()=>logo.n=0,3000);if(logo.n>=5){logo.n=0;owner?toast("Owner mode is on"):askPin()}return}
  if(t.dataset.cat){const c=t.dataset.cat===cat?null:t.dataset.cat;setNav("store");cat=c;render();return}
  if(t.dataset.close!==undefined||(t===ov&&e.target===ov)){closeModal();return}
  if(t.dataset.play){play(t.dataset.play);return}
  if(t.dataset.fav){toggleFav(t.dataset.fav);detail(t.dataset.fav);return}
  if(t.dataset.menu){showMenu(t);return}
  if(t.dataset.copy!==undefined){const x=$("#exp");x.select();(navigator.clipboard?navigator.clipboard.writeText(x.value):Promise.reject()).catch(()=>document.execCommand("copy")).then(()=>toast("Copied"));return}
  if(t.dataset.act){const[a,id]=t.dataset.act.split(":");closeMenus();
    if(a==="fav")toggleFav(id);
    if(a==="open"){const u=safeUrl(byId(id).url);u&&window.open(u,"_blank","noopener")}
    if(a==="edit")addForm(id);
    if(a==="del"&&confirm(`Remove "${byId(id).title}"?`)){custom=custom.filter(x=>x.id!==id);hidden=[...new Set([...hidden,id])];store.set(KEY.custom,custom);store.set(KEY.hidden,hidden);toast("Game removed");render()}
    return}
  if(t.id==="addbtn"){addForm();return}
  if(t.id==="exportbtn"){exportGames();return}
  if(t.id==="lockbtn"){setOwner(false);toast("Owner mode locked");render();return}
  if(t.id==="fbtn"){$("#filters").classList.toggle("on");return}
  if(t.id==="exit"){exitGame();return}
  if(t.id==="clear"){sel={genre:new Set(),tag:new Set(),platform:new Set()};query="";$("#q").value="";cat=null;render();return}
  if(t.matches(".card")){closeMenus();detail(t.dataset.id,t)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#launch").classList.contains("on"))exitGame();else closeModal();closeMenus();$("#filters").classList.remove("on")}});
$("#q").addEventListener("input",e=>{query=e.target.value;render()});
$("#fgroups").addEventListener("change",e=>{const i=e.target;i.checked?sel[i.dataset.f].add(i.value):sel[i.dataset.f].delete(i.value);render()});
document.addEventListener("submit",async e=>{
  if(e.target.id==="pinf"){e.preventDefault();
    if(hashPin(new FormData(e.target).get("pin"))===OWNER_HASH){setOwner(true);closeModal();toast("Owner mode unlocked");history.replaceState(null,"",location.pathname)}
    else{toast("Wrong PIN");modal.animate([{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"none"}],{duration:300})}
    return}
  if(e.target.id!=="addf"||!owner)return;e.preventDefault();
  const fd=new FormData(e.target),f=Object.fromEntries(fd),url=safeUrl(f.url);
  if(!url){toast("Enter a valid http(s) play link");return}
  const old=e.target.dataset.edit?byId(e.target.dataset.edit):null,file=fd.get("file");let img=safeUrl(f.img)||"";
  if(file&&file.size){try{img=await toDataUrl(file)}catch(x){toast("Could not read that image");return}}
  else if(!img&&old)img=old.img||"";
  const g={...(old||{}),id:old?old.id:"c"+Date.now(),title:f.title.trim(),url,img,genre:f.genre.trim(),platform:f.platform,tags:f.tags.split(",").map(s=>s.trim()).filter(Boolean),desc:f.desc.trim(),embed:!!f.embed};
  custom=[g,...custom.filter(x=>x.id!==g.id)];hidden=hidden.filter(x=>x!==g.id);
  store.set(KEY.custom,custom);store.set(KEY.hidden,hidden);closeModal();setNav("store");render();toast(`${g.title} saved`)});
function checkHash(){if(location.hash==="#owner"&&!owner)askPin()}
addEventListener("hashchange",checkHash);
setOwner(owner);render();checkHash();
</script>
</body>
